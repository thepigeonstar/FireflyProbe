name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm test
      - run: python3 -B tests/forward-diagnostic.test.py
      - run: go test ./... && go vet ./...
        working-directory: agent
      - run: bash -n setup.sh update.sh install-master.sh uninstall-master.sh tools/uninstall-traffic-reporter.sh agent/install.sh agent/bootstrap.sh agent/entry.sh
      - run: shellcheck -S warning setup.sh update.sh install-master.sh uninstall-master.sh tools/uninstall-traffic-reporter.sh agent/install.sh agent/bootstrap.sh agent/entry.sh
      - run: sudo bash tests/install-master.test.sh
      - run: bash tests/docker-bootstrap.test.sh
      - run: docker build -t lightprobe-check .
      - run: bash tests/alpine-install.test.sh
      - run: bash tests/gost-forwarding.test.sh
